name: Build Desktop Releases

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

jobs:
  desktop:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: always

    steps:
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 读取应用版本号
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path("pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(r"^\\s*version:\\s*([^\\s]+)\\s*$", text, re.M)
          if not match:
            raise SystemExit("version not found in pubspec.yaml")
          version = match.group(1).strip()
          name = version
          build = ""
          build_number = os.environ.get("GITHUB_RUN_NUMBER", "0")
          if "+" in version:
            name, build = version.split("+", 1)
            if not build.isdigit():
              raise SystemExit(f"build number must be numeric, got: {build}")
            build_number = build

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as fh:
            fh.write(f"version={version}\n")
            fh.write(f"name={name}\n")
            fh.write(f"build_number={build_number}\n")
          PY

      # 校验 tag 与 pubspec 版本一致（允许 vX.Y.Z 或 vX.Y.Z+N）
      - name: Validate tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          tag="${tag#v}"
          version="${{ steps.app_version.outputs.version }}"
          base="${{ steps.app_version.outputs.name }}"
          if [[ "$tag" != "$version" && "$tag" != "$base" ]]; then
            echo "::error ::Tag '$tag' does not match pubspec.yaml version '$version'."
            echo "::error ::Expected tag 'v$version' (full) or 'v$base' (without +build)."
            echo "::error ::Update pubspec.yaml or retag to match the version."
            exit 1
          fi

      # 安装稳定版 Rust 工具链（用于核心逻辑）
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # 安装稳定版 Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Linux 桌面构建依赖
      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      # macOS 桌面构建依赖
      - name: Install macOS desktop dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja pkg-config

      # Windows 桌面构建依赖
      - name: Install Windows desktop dependencies
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          choco install -y ninja

      # 启用目标平台的桌面支持
      - name: Enable desktop targets
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) flutter config --enable-linux-desktop ;;
            macos-latest) flutter config --enable-macos-desktop ;;
            windows-latest) flutter config --enable-windows-desktop ;;
          esac

      # 拉取 Dart/Flutter 依赖
      - name: Fetch Flutter packages
        run: flutter pub get

      # 安装 cargo-expand，避免 FRB 生成时自动安装带来的重试
      - name: Install cargo-expand
        run: cargo install cargo-expand --locked

      # 安装 FRB 代码生成工具（与仓库当前版本保持一致）
      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --locked --version 2.11.1

      # 根据最新 Rust 代码重新生成 FRB 绑定
      - name: Regenerate FRB bindings
        run: flutter_rust_bridge_codegen generate

      # 编译 Rust 库（release）
      - name: Build Rust crate (release)
        run: cargo build --manifest-path rust/Cargo.toml --release

      # 构建 Flutter 桌面可执行（release）
      - name: Build Flutter desktop app (release)
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) flutter build linux --release --build-name "${{ steps.app_version.outputs.name }}" --build-number "${{ steps.app_version.outputs.build_number }}" ;;
            macos-latest) flutter build macos --release --build-name "${{ steps.app_version.outputs.name }}" --build-number "${{ steps.app_version.outputs.build_number }}" ;;
            windows-latest) flutter build windows --release --build-name "${{ steps.app_version.outputs.name }}" --build-number "${{ steps.app_version.outputs.build_number }}" ;;
          esac

      # 打包 Linux 构建产物
      - name: Package Linux release
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf "dist/skydrivex-linux-${{ steps.app_version.outputs.version }}.tar.gz" bundle

      # 打包 Windows 构建产物
      - name: Package Windows release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/skydrivex-windows-${{ steps.app_version.outputs.version }}.zip"

      # 打包 macOS 构建产物
      - name: Package macOS release
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/skydrivex.app" "dist/skydrivex-macos-${{ steps.app_version.outputs.version }}.zip"

      # 上传 Linux 构建工件
      - name: Upload artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: skydrivex-linux
          path: dist/skydrivex-linux-${{ steps.app_version.outputs.version }}.tar.gz

      # 上传 Windows 构建工件
      - name: Upload artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: skydrivex-windows
          path: dist/skydrivex-windows-${{ steps.app_version.outputs.version }}.zip
          if-no-files-found: warn

      # 上传 macOS 构建工件
      - name: Upload artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: skydrivex-macos
          path: dist/skydrivex-macos-${{ steps.app_version.outputs.version }}.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          draft: false
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
